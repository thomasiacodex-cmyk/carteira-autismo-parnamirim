# =============================================================
# Nginx config — CIPTEA Digital Parnamirim
#
# 1. Copie para:  /etc/nginx/sites-available/ciptea
# 2. Ative:       ln -s /etc/nginx/sites-available/ciptea /etc/nginx/sites-enabled/
# 3. Remova:      rm /etc/nginx/sites-enabled/default
# 4. Teste:       nginx -t
# 5. Reinicie:    systemctl restart nginx
# 6. SSL:         certbot --nginx -d seudominio.com.br -d www.seudominio.com.br
#
# IMPORTANTE: Substitua TODAS as ocorrências de "seudominio.com.br"
#             pelo seu domínio real antes de usar este arquivo.
# =============================================================

# Redireciona HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name seudominio.com.br www.seudominio.com.br;

    # Permite o Certbot validar o domínio antes de configurar SSL
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — servidor principal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name seudominio.com.br www.seudominio.com.br;

    # Certificados SSL — preenchidos automaticamente pelo Certbot
    ssl_certificate     /etc/letsencrypt/live/seudominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seudominio.com.br/privkey.pem;

    # Parâmetros SSL modernos
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Limite de upload para documentos (fotos, laudos, CPF, RG)
    client_max_body_size 10M;

    # Proxy para o servidor Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Cache agressivo para assets estáticos do Next.js (hash no nome)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache para imagens públicas
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Logs
    access_log /var/log/nginx/ciptea-access.log;
    error_log  /var/log/nginx/ciptea-error.log;
}
